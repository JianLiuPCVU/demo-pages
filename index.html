function hierarchyFilterBar(scope){return `<div class="filterbar" id="${scope}-hierarchy"><span class="filter-title">Unified attributes</span>${treeFilter(scope,'Brand')}${treeFilter(scope,'Category')}<button onclick="clearAllHierarchy('${scope}')">Clear attributes</button><span class="muted">Brand and Category filters combine with AND.</span></div>`}
function redrawHierarchy(){if(tab==='Catalog'){let bar=$('catalog-hierarchy');if(bar)bar.outerHTML=hierarchyFilterBar('catalog');refreshTable()}else if(tab==='Report Preview')report()}
function toggleHierarchyPopup(id){treeOpen=treeOpen===id?'':id;redrawHierarchy()}
function toggleFilterBranch(key){treeCollapsed.has(key)?treeCollapsed.delete(key):treeCollapsed.add(key);redrawHierarchy()}
function chooseHierarchy(scope,k,key,checked){let p=JSON.parse(key),old=hierarchyFilters[scope][k];hierarchyFilters[scope][k]=checked?[...old.filter(x=>keyPath(x)!==key&&!(p.length&&isPrefix(p,x))),p]:old.filter(x=>keyPath(x)!==key);redrawHierarchy()}
function clearHierarchy(scope,k){hierarchyFilters[scope][k]=[];redrawHierarchy()}
function clearAllHierarchy(scope){hierarchyFilters[scope]={Brand:[],Category:[]};treeOpen='';redrawHierarchy()}
document.addEventListener('click',e=>{if(treeOpen&&!e.target.closest('.tree-filter')&&!e.target.closest('.filterbar')){treeOpen='';document.querySelectorAll('.tree-popup').forEach(x=>x.remove());document.querySelectorAll('.tree-trigger').forEach(x=>x.setAttribute('aria-expanded','false'))}})
function setReportGroup(v){reportGroup=v;reportExpanded.clear();treeOpen='';report()}
function reportItems(){return state.rows.filter(r=>(!reportTag||hasTag(r,reportTag))&&matchesHierarchy(r,'report')).flatMap(r=>r.markets.filter(m=>m.market===reportMarket).flatMap(m=>m.rpc.filter(p=>p.platform===reportPlatform).map(p=>({r,m,p,metrics:metric(p.id)}))))}
function toggleReportBranch(key){reportExpanded.has(key)?reportExpanded.delete(key):reportExpanded.add(key);report()}
// Tag groups may overlap across roots, but each node aggregates its own unique RPC set.
function buildTagReportTree(items){
 const tree=new Map();
 for(const t of roots()){
  const members=items.filter(x=>hasTag(x.r,t.id));
  if(!members.length)continue;
  const children=new Map(),subtags=kids(t.id),key='tag:'+t.id;
  for(const c of subtags){
   const assigned=members.filter(x=>x.r.tags.includes(c.id));
   if(!assigned.length)continue;
   const ck='tag:'+c.id;
   children.set(ck,{key:ck,path:[t.name,c.name],label:c.name,items:assigned,direct:assigned,children:new Map()});
  }
  tree.set(key,{key,path:[t.name],label:t.name,items:members,direct:subtags.length?[]:members,children});
 }
 return tree;
}
function buildReportTree(items){return reportGroup==='tag'?buildTagReportTree(items):buildTree(items,reportGroup==='brand'?'Brand':'Category',x=>x.r)}
function expandReportAll(){function walk(ns){for(let n of ns.values()){if(n.children.size||n.direct.length){reportExpanded.add(n.key);walk(n.children)}}}walk(buildReportTree(reportItems()));report()}
function collapseReportAll(){reportExpanded.clear();report()}
function groupMetricCells(a){return `<td class="num">${fmt(a.gtins)}</td><td class="num">${fmt(a.products)}</td><td class="num">${fmt(a.units)}</td><td class="num">${money(a.sales)}</td>`}
function hierarchyProductRows(items,depth){return [...new Map(items.map(x=>[x.m.market+'|'+x.p.platform+'|'+x.p.id,x])).values()].sort((a,b)=>a.p.title.localeCompare(b.p.title)||a.p.id.localeCompare(b.p.id)).map(x=>`<tr class="rpc-detail" data-rpc="${esc(x.p.id)}"><td><div class="group-cell" style="padding-left:${depth*22}px"><span class="detail-icon" aria-hidden="true">↳</span>${product(x.r,x.p)}</div></td>${groupMetricCells(aggregate([x]))}</tr>`).join('')}
function hierarchyReportRows(map,depth=0){return sortedNodes(map).map(n=>{let branch=n.children.size>0||n.direct.length>0,expanded=reportExpanded.has(n.key),a=aggregate(n.items);return `<tr class="group-row ${depth===0?'root':'branch'}" data-node-path="${esc(n.key)}"><td><div class="group-cell" style="padding-left:${depth*22}px" title="${esc(n.path.join(' > ')||'Unassigned')}">${branch?`<button class="group-toggle" aria-label="${expanded?'Collapse':'Expand'} ${esc(n.label)}" aria-expanded="${expanded}" data-group-path="${esc(n.key)}" onclick="toggleReportBranch(this.dataset.groupPath)">${expanded?'▾':'▸'}</button>`:'<span class="group-toggle empty">▸</span>'}<span class="group-folder" aria-hidden="true">${expanded?'📂':'📁'}</span><span>${esc(n.label)}</span>${n.path.length?`<span class="level">L${n.path.length}</span>`:''}</div></td>${groupMetricCells(a)}</tr>${branch&&expanded?hierarchyReportRows(n.children,depth+1)+hierarchyProductRows(n.direct,depth+1):''}`}).join('')}
function report(){let items=reportItems(),total=aggregate(items),tagGrouped=reportGroup==='tag',hierGrouped=['brand','category'].includes(reportGroup),grouped=tagGrouped||hierGrouped,k=reportGroup==='brand'?'Brand':'Category';let tree=grouped?buildReportTree(items):new Map();let reportRows=grouped?hierarchyReportRows(tree):items.map(x=>`<tr><td>${product(x.r,x.p)}</td><td>${x.r.gtin}</td><td class="path-cell">${esc(path(x.r,'Brand')||'Unassigned')}</td><td class="path-cell">${esc(path(x.r,'Category')||'Unassigned')}</td><td>${tagChips(x.r)}</td><td>${esc(x.p.tagKey+' > '+x.p.tagValue)}</td><td class="num">${fmt(x.metrics.units)}</td><td class="num">${money(x.metrics.sales)}</td></tr>`).join('');$('content').innerHTML=`<div class="taghint"><b>Retailer report preview · Last 30 days</b><br>Mock performance by RPC. Unified attributes are read-only and resolved from the current GTIN mapping. Retailer status behavior is simulated; all mapped RPCs are included here.</div><div class="toolbar"><label>Retailer<select onchange="reportPlatform=this.value;reportExpanded.clear();report()">${platforms.map(p=>`<option ${p===reportPlatform?'selected':''}>${p}</option>`).join('')}</select></label><label>Market<select onchange="reportMarket=this.value;reportExpanded.clear();report()">${['US','UK'].map(m=>`<option ${m===reportMarket?'selected':''}>${m}</option>`).join('')}</select></label><label>Global Tag filter<select onchange="reportTag=this.value;report()">${tagOptions(reportTag,'All Global Tags')}</select></label><label>Group by<select aria-label="Group by" onchange="setReportGroup(this.value)">${[['none','None (RPC)'],['brand','Unified Brand · Hierarchy'],['category','Unified Category · Hierarchy'],['tag','Global Tag · Hierarchy']].map(([v,l])=>`<option value="${v}" ${reportGroup===v?'selected':''}>${l}</option>`).join('')}</select></label><span class="count">${grouped?tree.size+' top-level groups · '+total.products+' unique RPCs':total.products+' RPCs'}</span></div>${hierarchyFilterBar('report')}${tagGrouped?'<div class="notice">Total hidden: a product can belong to multiple tag groups. Each group is deduplicated independently.</div>':''}${grouped?`<div class="report-group-controls"><b>${tagGrouped?'Global Tag':'Unified '+k}</b><button onclick="expandReportAll()">Expand all</button><button onclick="collapseReportAll()">Collapse all</button><span class="muted">${tagGrouped?'Expand a parent tag to view child tags; expand any leaf tag to view its products.':'Expand any group to view its subgroups and directly assigned products.'}</span></div>`:''}<div class="panel section tagreport"><table class="reporttable"><thead>${grouped?`<tr><th>${hierGrouped?'Unified '+k+' / Product':'Global Tag / Product'}</th><th class="num">GTINs</th><th class="num">RPCs</th><th class="num">Ordered Units</th><th class="num">Ordered Sales (USD)</th></tr>`:'<tr><th>RPC / Product</th><th>GTIN</th><th>Unified Brand</th><th>Unified Category</th><th>Global Tag</th><th>Retailer Tag</th><th class="num">Ordered Units</th><th class="num">Ordered Sales (USD)</th></tr>'}</thead><tbody>${reportRows||`<tr><td colspan="${grouped?5:8}" class="muted">No matching ${grouped?'groups':'products'}.</td></tr>`}</tbody>${tagGrouped?'':hierGrouped?`<tfoot><tr><td>Total</td>${groupMetricCells(total)}</tr></tfoot>`:`<tfoot><tr><td colspan="6">Total</td><td class="num">${fmt(total.units)}</td><td class="num">${money(total.sales)}</td></tr></tfoot>`}</table><p>${tagGrouped?'Only assigned tag groups are shown. Parent tags aggregate all child-tag products, deduplicated. Products may appear under multiple independent tags; each leaf group contains its assigned RPCs.':hierGrouped?'Each group includes directly assigned RPCs and all descendants. Product rows appear at their deepest assigned level. Unassigned products can also be expanded. Total is calculated once from matching RPCs, not by adding visible rows.':'Filtering keeps one row per mapped RPC. Changing unified attributes in Catalog immediately changes this simulated historical report.'}</p></div>`}

render();</script></html>
